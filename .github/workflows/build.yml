name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as the "latest-build" pre-release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (pure Kotlin)
        run: ./gradlew -p core test --console=plain

      - name: Build app and run app unit tests
        shell: bash  # explicit bash enables pipefail, so a failed build still fails through tee
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --continue 2>&1 | tee build.log

      # Room writes the database schema JSON to app/schemas during the build. It can't be generated in
      # the cloud dev environment, so publish it to refs/ci/room-schemas for committing (migration
      # tests need every past version's schema).
      - name: Publish Room schemas to refs/ci/room-schemas
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R app/schemas || { echo "no schemas generated"; exit 0; }
          mkdir -p /tmp/schemas && cp -r app/schemas /tmp/schemas/ && cd /tmp/schemas
          git init -q && git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Room schemas at ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/room-schemas

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: budgeting-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A fixed place to download the newest APK on a phone: the release asset is the .apk
      # itself (no zip), so it can be opened and installed straight from the browser.
      - name: Publish APK as the "latest-build" pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk budgeting.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build budgeting.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your phone: download budgeting.apk and open it to install or update."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

      # Last step so the compiler errors are at the end of the log.
      - name: Summarise build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Could not resolve|error:" build.log | head -80 || true

  # Runs the instrumented tests (app/src/androidTest) on an emulator and publishes a report —
  # screenshots, a failure summary, raw results and the log — to refs/ci/device-report, so it can
  # be fetched with git (`git fetch origin refs/ci/device-report`) without downloading artifacts.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The emulator's userdata partition needs several GB; the runner's preinstalled toolchains
      # that this project never uses take most of the disk (first run failed: "Not enough space
      # to create userdata partition").
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      # The Gradle and Kotlin daemons left over from compiling hold several GB; with the emulator's
      # 4 GB on top, the runner ran short of memory and the emulator froze part-way through the suite.
      - name: Free build daemons' memory before starting the emulator
        run: |
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # The AOSP image (no Google services — the app needs none) is lighter; with the extra
          # cores and memory, System UI no longer stalls into "isn't responding" dialogs.
          target: default
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disk-size: 3G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            nohup .github/scripts/device-monitor.sh > /dev/null 2>&1 &
            ./gradlew :app:connectedDebugAndroidTest --console=plain --continue > device-tests.log 2>&1; echo $? > device-tests.exit

      - name: Collect results
        if: always()
        run: |
          mkdir -p device-report/results device-report/screenshots
          cp device-tests.log device-report/ 2>/dev/null || true
          find app/build/outputs/connected_android_test_additional_output -name '*.png' -exec cp {} device-report/screenshots/ \; 2>/dev/null || true
          find app/build/outputs/androidTest-results -name '*.xml' -exec cp {} device-report/results/ \; 2>/dev/null || true
          mkdir -p device-report/diag
          cp device-diag/resources.txt device-report/diag/ 2>/dev/null || true
          tail -n 20000 device-diag/logcat.txt > device-report/diag/logcat-tail.txt 2>/dev/null || true
          free -m > device-report/diag/host-at-end.txt 2>&1; df -h >> device-report/diag/host-at-end.txt 2>&1 || true
          python3 .github/scripts/summarise_tests.py device-report/results > device-report/SUMMARY.txt || true
          { echo; echo "Last lines of the Gradle log:"; tail -n 60 device-tests.log 2>/dev/null; } >> device-report/SUMMARY.txt
          cat device-report/SUMMARY.txt

      - name: Publish report to refs/ci/device-report
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd device-report
          git init -q
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Device test report: run ${GITHUB_RUN_NUMBER} at ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/device-report

      - name: Fail if any device test failed
        if: always()
        run: exit "$(cat device-tests.exit 2>/dev/null || echo 1)"

