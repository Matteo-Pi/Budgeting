name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as the "latest-build" pre-release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (pure Kotlin)
        run: ./gradlew -p core test --console=plain

      - name: Build app and run app unit tests
        shell: bash  # explicit bash enables pipefail, so a failed build still fails through tee
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --continue 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: budgeting-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A fixed place to download the newest APK on a phone: the release asset is the .apk
      # itself (no zip), so it can be opened and installed straight from the browser.
      - name: Publish APK as the "latest-build" pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk budgeting.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build budgeting.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your phone: download budgeting.apk and open it to install or update."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

      # Last step so the compiler errors are at the end of the log.
      - name: Summarise build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Could not resolve|error:" build.log | head -80 || true
